<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{min-height:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-primary-fixed-variant":"#00458d","on-secondary":"#ffffff","surface-tint":"#005db8","surface":"#f9f9ff","on-surface-variant":"#414753","on-tertiary-fixed-variant":"#763400","on-tertiary":"#ffffff","inverse-on-surface":"#eef0fa","on-secondary-fixed-variant":"#2d476f","on-background":"#181c22","surface-container":"#ebedf7","surface-container-highest":"#e0e2eb","tertiary-fixed-dim":"#ffb68c","surface-container-lowest":"#ffffff","on-secondary-container":"#3f5881","on-primary-container":"#fefcff","primary-fixed":"#d6e3ff","on-tertiary-container":"#fffbff","inverse-primary":"#aac7ff","secondary-container":"#b6d0ff","primary-container":"#0a73e0","inverse-surface":"#2d3037","on-tertiary-fixed":"#321200","surface-container-low":"#f1f3fc","secondary-fixed-dim":"#aec7f7","surface-dim":"#d7dae3","on-error-container":"#93000a","tertiary-fixed":"#ffdbc9","error":"#ba1a1a","on-error":"#ffffff","surface-variant":"#e0e2eb","tertiary":"#964400","on-primary":"#ffffff","background":"#f9f9ff","on-secondary-fixed":"#001b3d","error-container":"#ffdad6","tertiary-container":"#bd5700","on-primary-fixed":"#001b3e","secondary-fixed":"#d6e3ff","surface-bright":"#f9f9ff","primary":"#005ab4","on-surface":"#181c22","outline":"#717785","primary-fixed-dim":"#aac7ff","surface-container-high":"#e6e8f1","outline-variant":"#c1c6d5","secondary":"#465f88"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},fontFamily:{headline:["Inter"],display:["Inter"],body:["Inter"],label:["Inter"]}}}};</script></head><body class="bg-surface text-on-surface font-body min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col justify-center relative w-full px-6 pt-safe pb-safe bg-surface"><div class="flex flex-col w-full py-4 space-y-6">
<!-- Brand & Mascot Header -->
<div class="flex flex-col items-center text-center space-y-3">
<div class="relative flex items-center justify-center p-3 rounded-2xl bg-surface-container shadow-sm">
<img alt="Logo Kost Penghuni" class="w-16 h-16 object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1Xii35YBSey8IIKG0uJKYjtYYO5OpiOEqsCSYjsvZeVgt-9-Z5pVR6VOkzbib_vWq33YEb3pJy47mNzQCECYv-sxdtvqraNR75XdLJESL4kd2RfD6VVyFwo65zBFJmEw0E5i4PHmSlya7OE6oWsM0b0n2UcnAcgHA4KdQOCnojVlZnhaslusJFKADzVXdEkUqXAqLh9Nn8XcV1airqcMWnZOYoL6dDM-cddGGetGSP1AgmY2BFdvcj80Zo">
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-primary rounded-full flex items-center justify-center shadow">
<span class="material-symbols-outlined text-[12px] text-on-primary">key</span>
</div>
</div>
<div class="space-y-1">

<h1 class="text-2xl font-bold tracking-tight text-on-surface">M-Kost</h1>
<p class="text-xs text-on-surface-variant font-medium">Akses kamar &amp; tagihan kost lebih mudah</p>
</div>
</div>
<!-- Segmented Switcher -->
<div class="w-full bg-surface-container-high p-1 rounded-lg flex items-center shadow-inner relative">
<button class="flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5" id="tab-login" onclick="switchTab('login')" type="button">
<span class="material-symbols-outlined text-base">login</span>
<span class="">Masuk</span>
</button>
<button class="flex-1 py-2 text-center text-sm font-medium rounded-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5" id="tab-register" onclick="switchTab('register')" type="button">
<span class="material-symbols-outlined text-base">person_add</span>
<span class="">Daftar</span>
</button>
</div>
<!-- Form Body -->
<form class="flex flex-col space-y-4" id="auth-form" onsubmit="event.preventDefault();">
<!-- Dynamic Register-Only Name Field -->
<div class="hidden flex-col space-y-1.5 transition-all duration-300" id="field-name">
<label class="text-xs font-medium text-on-surface flex items-center gap-1">
<span class="">Nama Lengkap (Sesuai KTP)</span>
</label>
<div class="relative flex items-center bg-surface-container rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-sm">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">badge</span>
<input class="w-full bg-transparent pl-10 pr-3 py-3 text-sm text-on-surface placeholder:text-outline focus:outline-none" id="input-name" placeholder="cth. Dimas Pratama" type="text">
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col space-y-1.5">
<label class="text-xs font-medium text-on-surface flex items-center justify-between">
<span class="">Nomor Handphone</span>
<span class="text-[11px] text-on-surface-variant font-normal">Terdaftar di WhatsApp</span>
</label>
<div class="flex items-center bg-surface-container rounded-xl focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-200 overflow-hidden">
<div class="flex items-center gap-1.5 pl-3.5 pr-3 py-3 bg-surface-container-high/60 select-none border-r border-outline-variant/30">
<span class="text-xs font-semibold text-on-surface tracking-tight flex items-center gap-1"><span class="">🇮🇩</span><span class="">+62</span></span>
</div>
<input class="w-full bg-transparent px-3.5 py-3 text-sm text-on-surface placeholder:text-outline focus:outline-none tracking-wide font-normal" id="input-phone" inputmode="numeric" placeholder="812 3456 7890" type="tel">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<label class="text-xs font-medium text-on-surface flex items-center justify-between">
<span class="">Kata Sandi</span>
<span class="text-[11px] text-on-surface-variant font-normal hidden" id="password-hint">Min. 8 karakter</span>
</label>
<div class="relative flex items-center bg-surface-container rounded-lg focus-within:bg-surface-container-lowest focus-within:shadow-sm transition-all duration-150">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none">lock</span>
<input class="w-full bg-transparent pl-10 pr-10 py-3 text-sm text-on-surface placeholder:text-outline focus:outline-none" id="input-password" placeholder="Masukkan kata sandi" type="password">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3 p-1 flex items-center justify-center text-outline hover:text-on-surface" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-lg" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Room Selection Hint (Register state) -->
<div class="hidden p-3 rounded-lg bg-surface-container-low text-xs text-on-surface-variant flex items-start gap-2" id="register-note">
<span class="material-symbols-outlined text-primary text-base mt-0.5">info</span>
<span class="">Setelah akun aktif, Anda dapat langsung menghubungkan nomor kamar dengan QR code dari pengelola.</span>
</div>
<!-- Submit CTA Button -->
<button class="w-full py-3.5 mt-2 rounded-lg bg-primary hover:bg-on-primary-fixed-variant text-on-primary text-sm font-semibold tracking-wide shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="btn-submit" type="button">
<span class="">Masuk ke Akun</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions & Recovery -->
<div class="flex flex-col items-center space-y-3 pt-1">
<div class="flex items-center" id="forgot-password-wrap">
<button class="text-xs font-semibold text-primary hover:text-on-primary-fixed-variant transition-colors py-1 px-2" type="button">
        Lupa kata sandi?
      </button>
</div>
<!-- Divider Pill / Micro-feature Notice -->
<div class="w-full flex items-center justify-center gap-3 pt-2">
<div class="h-0.5 flex-1 bg-surface-container-high rounded-full"></div>
<span class="text-[11px] font-medium text-on-surface-variant px-1">Atau</span>
<div class="h-0.5 flex-1 bg-surface-container-high rounded-full"></div>
</div>
<!-- Quick Biometric / Resident Scan Shortcut -->
<button class="w-full py-2.5 px-4 rounded-lg bg-surface-container text-on-surface text-xs font-semibold flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-base text-primary">qr_code_scanner</span>
<span class="">Masuk Cepat via Kunci Kamar Digital</span>
</button>
</div>
<!-- Microcopy Footer -->
<div class="mt-auto pt-4 text-center">
<p class="text-xs text-on-surface-variant">
      Butuh bantuan pemilik kost? 
      <a class="font-semibold text-primary hover:underline ml-0.5" href="javascript:void(0)">Hubungi Pengelola</a>
</p>
<div class="flex items-center justify-center gap-1 text-[11px] text-outline mt-1.5">
<span class="material-symbols-outlined text-xs">verified_user</span>
<span class="">Data penyewa tersinkronisasi aman</span>
</div>
</div>
</div>
<script>
  let currentTab = 'login';

  function switchTab(tab) {
    currentTab = tab;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const forgotWrap = document.getElementById('forgot-password-wrap');
    const btnSubmit = document.getElementById('btn-submit');
    const registerNote = document.getElementById('register-note');
    const passwordHint = document.getElementById('password-hint');

    if (tab === 'login') {
      // Button states
      tabLogin.className = "flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabRegister.className = "flex-1 py-2 text-center text-sm font-medium rounded-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5";

      // Form toggles
      fieldName.classList.add('hidden');
      fieldName.classList.remove('flex');
      forgotWrap.classList.remove('hidden');
      forgotWrap.classList.add('flex');
      registerNote.classList.add('hidden');
      passwordHint.classList.add('hidden');

      // Label
      btnSubmit.innerHTML = '<span>Masuk ke Akun</span><span class="material-symbols-outlined text-base">arrow_forward</span>';
    } else {
      // Button states
      tabRegister.className = "flex-1 py-2 text-center text-sm font-semibold rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabLogin.className = "flex-1 py-2 text-center text-sm font-medium rounded-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5";

      // Form toggles
      fieldName.classList.remove('hidden');
      fieldName.classList.add('flex');
      forgotWrap.classList.add('hidden');
      forgotWrap.classList.remove('flex');
      registerNote.classList.remove('hidden');
      passwordHint.classList.remove('hidden');

      // Label
      btnSubmit.innerHTML = '<span>Daftar Sekarang</span><span class="material-symbols-outlined text-base">how_to_reg</span>';
    }
  }

  function togglePasswordVisibility() {
    const inputPass = document.getElementById('input-password');
    const icon = document.getElementById('toggle-password-icon');
    if (!inputPass || !icon) return;

    if (inputPass.type === 'password') {
      inputPass.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      inputPass.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>

</body></html>
