<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tidak Ada Koneksi — MyKost</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #fee2e2;
      color: #dc2626;
      font-weight: 800;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Koneksi Terputus</h1>
    <p>Tidak dapat menjangkau server MyKost (mykost.zeinkunn.my.id). Periksa koneksi Wi-Fi atau data seluler Anda lalu coba kembali.</p>
    <button onclick="window.location.href='https://mykost.zeinkunn.my.id'">Coba Lagi</button>
  </div>
</body>
</html>
